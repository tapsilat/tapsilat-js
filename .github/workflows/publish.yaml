name: Publish Package

on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check release tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later; stay on 11.x so a new
      # npm major with a stricter Node engine range cannot break the release.
      - name: Update npm
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish
